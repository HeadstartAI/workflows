name: PR Review - Reusable

on:
  workflow_call:
    inputs:
      prompt:
        required: false
        type: string
        default: >-
          /pr-review-loop edit_mode: review_only. After completing the
          review, you must post the results to the PR itself: use
          mcp__github_inline_comment__create_inline_comment for each
          line-specific finding, and post an overall summary comment via
          `gh pr comment` (Bash). Do not just report findings in your final
          response — they must be posted to GitHub.
      extra_allowed_tools:
        required: false
        type: string
        default: ""
      anthropic_federation_rule_id:
        required: true
        type: string
      anthropic_organization_id:
        required: true
        type: string

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    concurrency:
      group: claude-pr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Get plugin marketplace token
        id: marketplace_auth
        run: |
          set -euo pipefail
          OIDC_TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agent-bridge-relay" | jq -r '.value')
          echo "::add-mask::${OIDC_TOKEN}"
          RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST https://agent-bridge-relay.onrender.com/oidc/token \
            -H "Authorization: Bearer ${OIDC_TOKEN}")
          HTTP_STATUS=$(echo "${RESPONSE}" | tail -n1)
          BODY=$(echo "${RESPONSE}" | sed '$d')
          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "Failed to obtain marketplace token (HTTP ${HTTP_STATUS}): ${BODY}" >&2
            exit 1
          fi
          MARKETPLACE_TOKEN=$(echo "${BODY}" | jq -r '.token')
          if [ -z "${MARKETPLACE_TOKEN}" ] || [ "${MARKETPLACE_TOKEN}" = "null" ]; then
            echo "Marketplace token response missing 'token' field: ${BODY}" >&2
            exit 1
          fi
          echo "::add-mask::${MARKETPLACE_TOKEN}"
          echo "token=${MARKETPLACE_TOKEN}" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: "*"
          anthropic_federation_rule_id: ${{ inputs.anthropic_federation_rule_id }}
          anthropic_organization_id: ${{ inputs.anthropic_organization_id }}
          plugin_marketplaces: |
            https://x-access-token:${{ steps.marketplace_auth.outputs.token }}@github.com/HeadstartAI/plugin-marketplace.git
            https://github.com/anthropics/claude-code.git
          plugins: |
            pr-review@headstart-marketplace
            code-review@claude-code-plugins
          prompt: ${{ inputs.prompt }}
          show_full_output: true
          claude_args: |
            --model claude-opus-5
            --allowedTools "Read,Skill,Glob,Grep,LSP,WebFetch,WebSearch,Bash(git:*),Bash(jq:*),Bash(gh pr comment:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment${{ inputs.extra_allowed_tools != '' && format(',{0}', inputs.extra_allowed_tools) || '' }}"
            --disallowedTools "ScheduleWakeup"
            --append-system-prompt "You are running as a one-shot GitHub Actions job. There is no future turn, resumption, or wakeup — once you finish responding, this process ends permanently. You must complete the entire review and post it to GitHub within this single run. Never end your turn while waiting on a subagent (e.g. the validator) to finish; wait for it synchronously and then post the results before stopping."
