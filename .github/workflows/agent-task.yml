name: Agent Task - Reusable

on:
  workflow_call:
    inputs:
      prompt:
        required: true
        type: string
      correlation_id:
        required: true
        type: string
      extra_allowed_tools:
        required: false
        type: string
        default: ""
      anthropic_federation_rule_id:
        required: true
        type: string
      anthropic_organization_id:
        required: true
        type: string

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Install merge guard
        run: |
          mkdir -p /tmp/agent-task-guard
          cat > /tmp/agent-task-guard/guard.py <<'PYTHON_GUARD'
          #!/usr/bin/env python3
          """PreToolUse guard for accidental PR merges in agent-task jobs.

          This is a command guardrail, not a security boundary against a hostile agent with
          write access or credentials. Enforce hard restrictions with GitHub branch rules.
          """
          import json
          import re
          import sys


          def blocks(command):
              # Inspect the whole shell input, including chained commands and substitutions.
              # Overblocking commands that merely mention a merge is preferable to merging.
              if re.search(r"\bgh\s+pr\s+merge\b", command, re.I):
                  return True
              if not re.search(r"\bgh\s+api\b", command, re.I):
                  return False
              if re.search(r"(?:/repos/|\brepos/)[^\s'\";]+/pulls/\d+/merge\b", command, re.I):
                  return True
              if re.search(r"\b(?:mergePullRequest|enablePullRequestAutoMerge|enqueuePullRequest)\b", command, re.I):
                  return True
              # A GraphQL query can also be loaded from a file, stdin, or shell expansion.
              # Deny GraphQL writes rather than trying to interpret arbitrary shell input.
              if re.search(r"\bgh\s+api\s+graphql\b", command, re.I):
                  return bool(re.search(r"\bmutation\b|--input\b|\$\(|<|@", command, re.I) or re.search(r"(?:^|\s)-F(?:\s|=)", command))
              return False


          def main():
              try:
                  data = json.load(sys.stdin)
                  command = data["tool_input"]["command"]
                  if not isinstance(command, str):
                      raise ValueError("Missing Bash command")
              except (ValueError, KeyError, TypeError):
                  print("Cannot inspect Bash command; blocked by merge guard", file=sys.stderr)
                  return 2
              if data.get("tool_name") == "Bash" and blocks(command):
                  print("PR merges are disabled for agent-task jobs", file=sys.stderr)
                  return 2
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PYTHON_GUARD
          chmod +x /tmp/agent-task-guard/guard.py
      - name: Get plugin marketplace token
        id: marketplace_auth
        run: |
          set -euo pipefail
          OIDC_TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agent-bridge-relay" | jq -r '.value')
          echo "::add-mask::${OIDC_TOKEN}"
          RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST https://agent-bridge-relay.onrender.com/oidc/token \
            -H "Authorization: Bearer ${OIDC_TOKEN}")
          HTTP_STATUS=$(echo "${RESPONSE}" | tail -n1)
          BODY=$(echo "${RESPONSE}" | sed '$d')
          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "Failed to obtain marketplace token (HTTP ${HTTP_STATUS}): ${BODY}" >&2
            exit 1
          fi
          MARKETPLACE_TOKEN=$(echo "${BODY}" | jq -r '.token')
          if [ -z "${MARKETPLACE_TOKEN}" ] || [ "${MARKETPLACE_TOKEN}" = "null" ]; then
            echo "Marketplace token response missing 'token' field: ${BODY}" >&2
            exit 1
          fi
          echo "::add-mask::${MARKETPLACE_TOKEN}"
          echo "token=${MARKETPLACE_TOKEN}" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@9ca9355b36297178e28d37c799d1c9c8a28e6507
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_federation_rule_id: ${{ inputs.anthropic_federation_rule_id }}
          anthropic_organization_id: ${{ inputs.anthropic_organization_id }}
          plugin_marketplaces: "https://x-access-token:${{ steps.marketplace_auth.outputs.token }}@github.com/HeadstartAI/plugin-marketplace.git"
          plugins: ""
          prompt: ${{ inputs.prompt }}
          show_full_output: true
          claude_args: |
            --model claude-opus-5-5
            --settings '{"hooks":{"PreToolUse":[{"matcher":"Bash","hooks":[{"type":"command","command":"/tmp/agent-task-guard/guard.py","timeout":10}]}]}}'
            --allowedTools "Read,Skill,Glob,Grep,LSP,WebFetch,WebSearch,Write,Edit,Bash(git:*),Bash(gh pr:*),Bash(gh api:*),Bash(jq:*)${{ inputs.extra_allowed_tools != '' && format(',{0}', inputs.extra_allowed_tools) || '' }}"
            --disallowedTools "ScheduleWakeup,Bash(gh pr merge:*)"
            --append-system-prompt "You are running as a one-shot GitHub Actions job. There is no future turn, resumption, or wakeup — once you finish responding, this process ends permanently."
      - name: Upload agent result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-result-${{ inputs.correlation_id }}
          path: /home/runner/work/_temp/claude-execution-output.json
          retention-days: 7
